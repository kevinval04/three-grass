<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grass Field with Campfire</title>
    <style>
      @font-face {
        font-family: "SAOUI";
        src: url("/fonts/SAOUI-Regular.otf") format("opentype");
        font-weight: normal;
      }

      @font-face {
        font-family: "SAOUI";
        src: url("/fonts/SAOUI-Bold.otf") format("opentype");
        font-weight: bold;
      }

      @font-face {
        font-family: "SAOWelcome";
        src: url("/fonts/SAOWelcome-Regular.otf") format("opentype");
        font-weight: normal;
      }

      @font-face {
        font-family: "SAOWelcome";
        src: url("/fonts/SAOWelcome-Bold.otf") format("opentype");
        font-weight: bold;
      }

      body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: "SAOUI", Arial, sans-serif;
      }

      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      #three-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        color: white;
        min-width: 280px;
        max-height: 80vh;
        overflow-y: auto;
        z-index: 100;
      }

      .control-group {
        margin-bottom: 15px;
      }

      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: bold;
      }

      .control-group input[type="range"] {
        width: 100%;
        margin-bottom: 5px;
      }

      .value-display {
        font-size: 12px;
        color: #ccc;
      }

      h3 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #ff6b35;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }

      h3:first-child {
        margin-top: 0;
      }

      #explore-text {
        position: fixed;
        bottom: 30px;
        left: 30px;
        font-family: "SAOWelcome", "SAOUI", Arial, sans-serif;
        font-size: 64px;
        font-weight: bold;
        color: #f0fffe;
        text-transform: uppercase;
        letter-spacing: 20px;
        z-index: 1000;
        user-select: none;
        cursor: pointer;
        transition: text-shadow 0.4s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      #explore-text:hover {
        text-shadow: 0 0 6px rgba(255, 255, 255, 0.3),
          0 0 12px rgba(255, 255, 255, 0.5);
      }

      /* Loading Screen Styles */
      #loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #20293C 0%, #20293C 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 10000;
        font-family: "SAOWelcome", "SAOUI", Arial, sans-serif;
        color: white;
        transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
      }

      #loading-screen.hidden {
        opacity: 0;
        visibility: hidden;
      }

      .loading-title {
        font-size: 72px;
        font-weight: bold;
        letter-spacing: 8px;
        text-transform: uppercase;
        margin-bottom: 40px;
        text-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        animation: pulse 2s ease-in-out infinite;
      }

      .loading-progress {
        width: 400px;
        height: 8px;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 20px;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }

      .loading-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #ffffff 0%, #f0f0f0 100%);
        border-radius: 2px;
        width: 0%;
        transition: width 0.3s ease;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      }

      .loading-text {
        font-size: 18px;
        font-weight: normal;
        letter-spacing: 2px;
        opacity: 0.9;
        margin-bottom: 10px;
      }

      .loading-asset {
        font-size: 14px;
        font-weight: normal;
        letter-spacing: 1px;
        opacity: 0.7;
        font-style: italic;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.05); opacity: 0.8; }
      }

      /* Mobile/Small screen styles */
      @media (max-width: 768px) {
        #explore-text {
          left: 50%;
          transform: translateX(-50%);
          text-align: center;
        }
        
        .loading-title {
          font-size: 48px;
          letter-spacing: 4px;
        }
        
        .loading-progress {
          width: 300px;
        }
      }
    </style>
  </head>
