<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campfire Scene</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background: #000;
        font-family: Arial, sans-serif;
      }
      
      #app {
        position: relative;
        width: 100vw;
        height: 100vh;
      }
      
      #three-canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      
      #controls {
        position: absolute;
        top: 20px;
        left: 20px;
        background: rgba(0, 0, 0, 0.8);
        padding: 20px;
        border-radius: 10px;
        color: white;
        min-width: 280px;
        max-height: 80vh;
        overflow-y: auto;
        z-index: 100;
      }
      
      .control-group {
        margin-bottom: 15px;
      }
      
      .control-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: bold;
      }
      
      .control-group input[type="range"] {
        width: 100%;
        margin-bottom: 5px;
      }
      
      .control-group input[type="color"] {
        width: 50px;
        height: 30px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
      
      .value-display {
        font-size: 12px;
        color: #ccc;
      }
      
      h3 {
        margin-top: 20px;
        margin-bottom: 10px;
        color: #ff6b35;
        border-bottom: 1px solid #333;
        padding-bottom: 5px;
      }
      
      h3:first-child {
        margin-top: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="three-canvas"></canvas>
      <div id="controls">
        <h3>🔥 Main Flame Controls</h3>
        
        <div class="control-group">
          <label for="mainFlameStart">Main Flame Start</label>
          <input type="range" id="mainFlameStart" min="0" max="1" step="0.01" value="0.4">
          <div class="value-display" id="mainFlameStartValue">0.4</div>
        </div>
        
        <div class="control-group">
          <label for="mainFireIntensity">Main Fire Intensity</label>
          <input type="range" id="mainFireIntensity" min="0" max="3" step="0.1" value="1.3">
          <div class="value-display" id="mainFireIntensityValue">1.3</div>
        </div>
        
        <div class="control-group">
          <label for="mainVoronoiSpeed">Main Fire Speed</label>
          <input type="range" id="mainVoronoiSpeed" min="0" max="5" step="0.1" value="0.4">
          <div class="value-display" id="mainVoronoiSpeedValue">0.4</div>
        </div>

        <h3>🔥 Inner Flame Controls</h3>
        
        <div class="control-group">
          <label for="innerFlameStart">Inner Flame Start</label>
          <input type="range" id="innerFlameStart" min="0" max="1" step="0.01" value="0.32">
          <div class="value-display" id="innerFlameStartValue">0.32</div>
        </div>
        
        <div class="control-group">
          <label for="innerFireIntensity">Inner Fire Intensity</label>
          <input type="range" id="innerFireIntensity" min="0" max="3" step="0.1" value="1.0">
          <div class="value-display" id="innerFireIntensityValue">1.0</div>
        </div>
        
        <div class="control-group">
          <label for="innerVoronoiSpeed">Inner Fire Speed</label>
          <input type="range" id="innerVoronoiSpeed" min="0" max="5" step="0.1" value="0.6">
          <div class="value-display" id="innerVoronoiSpeedValue">0.6</div>
        </div>

        <h3>✨ HDR Bloom Controls</h3>
        
        <div class="control-group">
          <label for="bloomStrength">Bloom Strength</label>
          <input type="range" id="bloomStrength" min="0.01" max="0.2" step="0.005" value="0.12">
          <div class="value-display" id="bloomStrengthValue">0.12</div>
        </div>
        
        <div class="control-group">
          <label for="bloomThreshold">Bloom Threshold</label>
          <input type="range" id="bloomThreshold" min="0" max="2" step="0.05" value="0.9">
          <div class="value-display" id="bloomThresholdValue">0.9</div>
        </div>
        
        <div class="control-group">
          <label for="exposure">HDR Exposure</label>
          <input type="range" id="exposure" min="0.1" max="3" step="0.1" value="1.0">
          <div class="value-display" id="exposureValue">1.0</div>
        </div>

        <h3>🎨 Toon Shader Controls</h3>
        
        <div class="control-group">
          <label for="toonLevels">Toon Levels</label>
          <input type="range" id="toonLevels" min="2" max="8" step="1" value="4">
          <div class="value-display" id="toonLevelsValue">4</div>
        </div>
        
        <div class="control-group">
          <label for="ambientStrength">Ambient Strength</label>
          <input type="range" id="ambientStrength" min="0" max="1" step="0.1" value="0.3">
          <div class="value-display" id="ambientStrengthValue">0.3</div>
        </div>

        <h3>🏕️ Scene Controls</h3>
        
        <div class="control-group">
          <label for="cameraDistance">Camera Distance</label>
          <input type="range" id="cameraDistance" min="1" max="10" step="0.1" value="3">
          <div class="value-display" id="cameraDistanceValue">3</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/campfire.ts"></script>
  </body>
</html>
